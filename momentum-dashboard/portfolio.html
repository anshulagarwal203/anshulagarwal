<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Dashboard — Portfolio Composition</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<div class="app-shell" id="app-root">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> Momentum Dashboard<a href="../index.html" class="back">← anshulagarwal.com</a></div>
    <div class="sidebar-section-label">Navigate</div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">Read-only · No orders ever placed from this site</div>
  </aside>
  <div>
    <div class="topbar-v2">
      <button class="sidebar-toggle" aria-label="Toggle menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="stat-chip"><span class="stat-label">Portfolio Value</span><span class="stat-value" id="tb-value">—</span></div>
      <div class="stat-chip"><span class="stat-label">Today's Return</span><span class="stat-value" id="tb-today">—</span></div>
      <div class="stat-chip"><span class="stat-label">Benchmark Return</span><span class="stat-value" id="tb-bench">—</span></div>
      <div class="stat-chip"><span class="stat-label">Cash</span><span class="stat-value" id="tb-cash">—</span></div>
      <div class="stat-chip"><span class="stat-label">Exposure</span><span class="stat-value" id="tb-exposure">—</span></div>
      <div class="stat-chip"><span class="stat-label">Last Updated</span><span class="stat-value" id="tb-updated">—</span></div>
      <div class="stat-chip mode-chip"><span class="stat-label">Mode</span><span class="mode-pill" id="tb-mode">—</span></div>
    </div>
    <main class="content">
      <h1>Portfolio Composition</h1>
      <p class="subtitle" id="generated-at">Loading…</p>

      <h2>Sector Allocation</h2>
      <div class="panel fade-in"><div id="sector-alloc"></div></div>

      <h2>Holding Weights</h2>
      <div class="panel fade-in"><div id="holding-alloc"></div></div>

      <h2>Cash vs. Invested</h2>
      <div class="panel fade-in"><div id="cash-alloc"></div></div>
    </main>
  </div>
</div>
<script src="assets/app.js?v=2"></script>
<script>
(async function () {
  renderShell("portfolio.html");
  const [holdings, portfolio] = await Promise.all([fetchJSON("holdings.json"), fetchJSON("portfolio.json")]);

  document.getElementById("generated-at").textContent = holdings
    ? `Last Updated: ${fmtDate(holdings.as_of)} (paper trading run)`
    : "No data yet.";

  const rows = (holdings && holdings.holdings) || [];
  if (!rows.length) {
    document.getElementById("sector-alloc").innerHTML = emptyState("No open positions.");
    document.getElementById("holding-alloc").innerHTML = emptyState("No open positions.");
  } else {
    const bySector = new Map();
    rows.forEach(h => {
      const val = h.current_price * h.shares;
      bySector.set(h.sector, (bySector.get(h.sector) || 0) + val);
    });
    const totalHoldingsVal = [...bySector.values()].reduce((a, b) => a + b, 0);
    const sectorItems = [...bySector.entries()]
      .map(([label, value]) => ({ label, value, pct: totalHoldingsVal ? (value / totalHoldingsVal * 100) : 0 }))
      .sort((a, b) => b.pct - a.pct);
    renderAllocationBars("sector-alloc", sectorItems);

    const holdingItems = rows.map(h => ({
      label: h.ticker.replace(".NS", ""), value: h.current_price * h.shares, pct: h.weight_pct || 0,
    })).sort((a, b) => b.pct - a.pct);
    renderAllocationBars("holding-alloc", holdingItems);
  }

  if (portfolio && portfolio.portfolio_value) {
    const cashPct = portfolio.cash / portfolio.portfolio_value * 100;
    const investedPct = (portfolio.invested_capital || 0) / portfolio.portfolio_value * 100;
    renderAllocationBars("cash-alloc", [
      { label: "Invested", value: portfolio.invested_capital, pct: investedPct },
      { label: "Cash", value: portfolio.cash, pct: cashPct },
    ]);
  } else {
    document.getElementById("cash-alloc").innerHTML = emptyState("No portfolio data yet.");
  }
})();
</script>
</body>
</html>
