<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Dashboard — Trade History</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="mode-banner">MODE: PAPER TRADING — no real orders, ever, on this site</div>
<div class="topbar">
  <div class="brand"><a href="../index.html" class="back">← anshulagarwal.com</a><span class="dot"></span> Momentum Dashboard</div>
  <nav class="tabs" id="nav-tabs"></nav>
</div>
<main>
  <h1>Trade History</h1>
  <p class="subtitle" id="generated-at">Loading…</p>
  <div class="read-only-banner">Reasons shown are the actual mechanical signals the strategy used (momentum entry threshold; stop-loss / target / RSI / time-based exit) — not AI-generated commentary.</div>

  <div class="trade-filter" id="trade-filter">
    <button data-filter="all" class="active">All Trades</button>
    <button data-filter="BUY">Buy Orders</button>
    <button data-filter="SELL">Sell Orders</button>
  </div>

  <div id="trade-cards"></div>
</main>
<script src="assets/app.js"></script>
<script>
(async function () {
  renderNav("trades.html");
  const [trades, holdings] = await Promise.all([fetchJSON("trades.json"), fetchJSON("holdings.json")]);

  const asOf = (trades && trades.as_of) || (holdings && holdings.as_of);
  document.getElementById("generated-at").textContent = asOf
    ? `Last Updated: ${fmtDate(asOf)} (paper trading run)`
    : "No data yet.";

  const buyCards = ((holdings && holdings.holdings) || []).map(h => ({
    kind: "BUY", date: h.entry_date, symbol: h.ticker, company: h.company,
    h,
  }));
  const sellCards = ((trades && trades.trades) || []).map(t => ({
    kind: "SELL", date: t.exit_date, symbol: t.symbol, company: null,
    t,
  }));

  const all = [...buyCards, ...sellCards].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

  const container = document.getElementById("trade-cards");
  if (!all.length) {
    container.innerHTML = emptyState("No trades yet — this fills in as the strategy enters and exits positions.");
    document.getElementById("trade-filter").style.display = "none";
    return;
  }

  function renderBuyCard(c) {
    const h = c.h;
    const value = h.current_price * h.shares;
    return `
    <div class="trade-card" data-kind="BUY">
      <div class="trade-card-header">
        <span class="trade-badge buy">BUY</span>
        <span class="trade-date">${c.date ? fmtDate(c.date).split(",")[0] : "—"}</span>
        <span class="trade-ticker">${c.symbol.replace(".NS", "")}</span>
        <span class="trade-company">${h.company || h.sector || ""}</span>
        <div style="margin-left:auto; text-align:right;">
          <div class="trade-headline-val pos">${fmtCurrency(h.entry_price * h.shares)}</div>
          <div class="trade-headline-sub">${h.shares} shares @ ${fmtCurrency(h.entry_price, 2)}</div>
        </div>
      </div>
      <div class="trade-reason-label">Entry Signal</div>
      <div class="trade-reason-text">${entryThesis(h)}</div>
      <div class="trade-stats-grid">
        <div class="trade-stat"><div class="label">Shares Held</div><div class="value">${h.shares}</div></div>
        <div class="trade-stat"><div class="label">Current Value</div><div class="value">${fmtCurrency(value)}</div></div>
        <div class="trade-stat"><div class="label">Unrealized Return</div><div class="value ${signClass(h.current_return_pct)}">${fmtPct(h.current_return_pct)}</div></div>
        <div class="trade-stat"><div class="label">Portfolio Weight</div><div class="value">${h.weight_pct !== null ? h.weight_pct.toFixed(1) + "%" : "—"}</div></div>
      </div>
    </div>`;
  }

  function renderSellCard(c) {
    const t = c.t;
    const reason = parseExitReason(t.exit_reason);
    return `
    <div class="trade-card" data-kind="SELL">
      <div class="trade-card-header">
        <span class="trade-badge sell">SELL</span>
        <span class="trade-date">${fmtDate(t.exit_date).split(",")[0]}</span>
        <span class="trade-ticker">${t.symbol.replace(".NS", "")}</span>
        <span class="trade-company">${t.sector || ""}</span>
        <div style="margin-left:auto; text-align:right;">
          <div class="trade-headline-val ${signClass(t.pnl)}">${fmtCurrency(t.pnl, 2)}</div>
          <div class="trade-headline-sub ${signClass(t.return_pct)}">${fmtPct(t.return_pct)}</div>
        </div>
      </div>
      <div class="trade-reason-label">${reason.label}</div>
      <div class="trade-reason-text">${reason.sentence}</div>
      <div class="roundtrip">
        <div class="rt-leg"><span class="rt-label">Bought</span><span class="rt-val">${fmtCurrency(t.entry_price, 2)}</span><span class="trade-date">${t.entry_date}</span></div>
        <span class="rt-arrow">→</span>
        <div class="rt-leg"><span class="rt-label">Sold</span><span class="rt-val">${fmtCurrency(t.exit_price, 2)}</span><span class="trade-date">${t.exit_date}</span></div>
      </div>
      <div class="trade-stats-grid">
        <div class="trade-stat"><div class="label">Shares Sold</div><div class="value">${t.shares}</div></div>
        <div class="trade-stat"><div class="label">Holding Period</div><div class="value">${t.holding_period_days ?? "—"} days</div></div>
        <div class="trade-stat"><div class="label">Net Proceeds</div><div class="value">${fmtCurrency(t.exit_price * t.shares)}</div></div>
      </div>
    </div>`;
  }

  function render(filter) {
    const filtered = filter === "all" ? all : all.filter(c => c.kind === filter);
    container.innerHTML = filtered.length
      ? filtered.map(c => c.kind === "BUY" ? renderBuyCard(c) : renderSellCard(c)).join("")
      : emptyState(`No ${filter === "BUY" ? "buy" : "sell"} orders yet.`);
  }

  render("all");
  document.querySelectorAll("#trade-filter button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#trade-filter button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.filter);
    });
  });
})();
</script>
</body>
</html>
