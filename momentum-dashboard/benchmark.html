<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Dashboard — Benchmark</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<div class="app-shell" id="app-root">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> Momentum Dashboard<a href="../index.html" class="back">← anshulagarwal.com</a></div>
    <div class="sidebar-section-label">Navigate</div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">Read-only · No orders ever placed from this site</div>
  </aside>
  <div>
    <div class="topbar-v2">
      <button class="sidebar-toggle" aria-label="Toggle menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="stat-chip"><span class="stat-label">Portfolio Value</span><span class="stat-value" id="tb-value">—</span></div>
      <div class="stat-chip"><span class="stat-label">Today's Return</span><span class="stat-value" id="tb-today">—</span></div>
      <div class="stat-chip"><span class="stat-label">Benchmark Return</span><span class="stat-value" id="tb-bench">—</span></div>
      <div class="stat-chip"><span class="stat-label">Cash</span><span class="stat-value" id="tb-cash">—</span></div>
      <div class="stat-chip"><span class="stat-label">Exposure</span><span class="stat-value" id="tb-exposure">—</span></div>
      <div class="stat-chip"><span class="stat-label">Last Updated</span><span class="stat-value" id="tb-updated">—</span></div>
      <div class="stat-chip mode-chip"><span class="stat-label">Mode</span><span class="mode-pill" id="tb-mode">—</span></div>
    </div>
    <main class="content">
      <h1>Benchmark Comparison</h1>
      <p class="subtitle" id="generated-at">Loading… normalized to 100 on Day 1.</p>
      <div id="benchmarks-container"></div>
    </main>
  </div>
</div>
<script src="assets/app.js?v=2"></script>
<script>
(async function () {
  renderShell("benchmark.html");
  const bench = await fetchJSON("benchmark.json");

  document.getElementById("generated-at").textContent = bench
    ? `Last Updated: ${fmtDate(bench.as_of)} (paper trading run) — normalized to 100 on Day 1.`
    : "No data yet.";

  const container = document.getElementById("benchmarks-container");
  if (!bench || !bench.benchmarks) {
    container.innerHTML = emptyState("No benchmark data yet — updates after the next paper trading session.");
    return;
  }

  const wanted = ["NIFTY50", "NIFTY500"];
  let html = "";
  for (const key of wanted) {
    const b = bench.benchmarks[key];
    if (!b) continue;
    const canvasId = `chart-${key}`;
    const rm = b.relative_metrics || {};
    html += `
      <div class="panel fade-in">
        <h3>Portfolio vs ${b.name} (${b.ticker})</h3>
        ${!b.available ? emptyState(b.note || "Unavailable") : `
          <canvas id="${canvasId}" style="width:100%;height:260px;"></canvas>
          <div class="kpi-grid" style="margin-top:16px;">
            <div class="kpi-card"><div class="label">Alpha (annualized)</div><div class="value ${signClass(rm.alpha_annualized_pct)}">${rm.available ? fmtPct(rm.alpha_annualized_pct) : "—"}</div></div>
            <div class="kpi-card"><div class="label">Relative Performance</div><div class="value ${signClass(rm.relative_performance_pct)}">${rm.available ? fmtPct(rm.relative_performance_pct) : "—"}</div></div>
            <div class="kpi-card"><div class="label">Maximum Drawdown</div><div class="value neg">${rm.available ? fmtPct(rm.portfolio_max_drawdown_pct) : "—"}</div></div>
            <div class="kpi-card"><div class="label">Information Ratio</div><div class="value">${rm.available ? fmtNum(rm.information_ratio) : "—"}</div></div>
          </div>
          ${!rm.available ? `<p class="subtitle" style="margin-top:12px">${rm.note || "Not enough aligned history yet."}</p>` : ""}
        `}
      </div>`;
  }
  container.innerHTML = html || emptyState("No benchmark data available.");

  for (const key of wanted) {
    const b = bench.benchmarks[key];
    if (b && b.available && b.normalized_portfolio) {
      simpleLineChart(`chart-${key}`, [
        { label: "Portfolio", color: CHART_COLORS.portfolio, points: seriesFromDict(b.normalized_portfolio) },
        { label: b.name, color: CHART_COLORS.benchmark, points: seriesFromDict(b.normalized_benchmark) },
      ], { yDecimals: 0 });
    }
  }
})();
</script>
</body>
</html>
