<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Dashboard — Latest Daily Report</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<div class="app-shell" id="app-root">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> Momentum Dashboard<a href="../index.html" class="back">← anshulagarwal.com</a></div>
    <div class="sidebar-section-label">Navigate</div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">Read-only · No orders ever placed from this site</div>
  </aside>
  <div>
    <div class="topbar-v2">
      <button class="sidebar-toggle" aria-label="Toggle menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="stat-chip"><span class="stat-label">Portfolio Value</span><span class="stat-value" id="tb-value">—</span></div>
      <div class="stat-chip"><span class="stat-label">Today's Return</span><span class="stat-value" id="tb-today">—</span></div>
      <div class="stat-chip"><span class="stat-label">Benchmark Return</span><span class="stat-value" id="tb-bench">—</span></div>
      <div class="stat-chip"><span class="stat-label">Cash</span><span class="stat-value" id="tb-cash">—</span></div>
      <div class="stat-chip"><span class="stat-label">Exposure</span><span class="stat-value" id="tb-exposure">—</span></div>
      <div class="stat-chip"><span class="stat-label">Last Updated</span><span class="stat-value" id="tb-updated">—</span></div>
      <div class="stat-chip mode-chip"><span class="stat-label">Mode</span><span class="mode-pill" id="tb-mode">—</span></div>
    </div>
    <main class="content">
      <h1>Latest Daily Report</h1>
      <p class="subtitle" id="generated-at">Loading…</p>
      <div id="report-container"></div>

      <h2>Recent PDF Reports</h2>
      <div class="panel fade-in">
        <ul class="pdf-list" id="pdf-list"></ul>
      </div>
    </main>
  </div>
</div>
<script src="assets/app.js?v=2"></script>
<script>
(async function () {
  renderShell("report.html");
  const r = await fetchJSON("latest_report.json");

  document.getElementById("generated-at").textContent = r
    ? `Last Updated: ${fmtDate(r.as_of)} (paper trading run) — mode: ${r.mode}, phase: ${r.phase ?? "n/a"}`
    : "No data yet.";

  const c = document.getElementById("report-container");
  if (!r) { c.innerHTML = emptyState("No latest_report.json yet."); return; }

  let html = `<div class="kpi-grid">
    <div class="kpi-card fade-in"><div class="label">Portfolio Value</div><div class="value">${fmtCurrency(r.portfolio_value)}</div></div>
    <div class="kpi-card fade-in"><div class="label">Cash</div><div class="value">${fmtCurrency(r.cash)}</div></div>
    <div class="kpi-card fade-in"><div class="label">Holdings</div><div class="value">${r.num_holdings}</div></div>
  </div>`;

  // Today's Execution — never a fabricated/stale placeholder. Only real
  // fills whose own timestamp is actually today, IST (see json_export.py
  // build_latest_report_json / _entry_ist_date).
  html += `<div class="panel fade-in"><h3>Today's Execution</h3>`;
  const exec = r.today_execution;
  if (!exec || !exec.executed) {
    html += `<div class="wait-state"><span class="wait-dot"></span>Waiting for today's execution…</div>`;
  } else if (!exec.fills || exec.fills.length === 0) {
    html += `<div class="wait-state"><span class="wait-dot"></span>Execution complete — no trades today.</div>`;
  } else {
    html += `<div class="table-scroll"><table><thead><tr>
      <th>Symbol</th><th>Action</th><th>Qty</th><th>Price</th><th>Time</th></tr></thead><tbody>`;
    exec.fills.forEach(f => {
      html += `<tr><td class="text-cell"><strong>${(f.symbol || "").replace(".NS", "")}</strong></td>
        <td class="${f.action === "BUY" ? "pos" : ""}">${f.action}</td>
        <td>${f.qty}</td><td>${fmtCurrency(f.price, 2)}</td>
        <td class="text-cell muted">${fmtDate(f.timestamp)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;

  html += `<div class="panel fade-in"><h3>Top 10 Momentum Candidates</h3>`;
  if (r.top_10_candidates && r.top_10_candidates.length) {
    html += `<div class="table-scroll"><table><thead><tr>
      <th>Rank</th><th>Ticker</th><th>Name</th><th>Sector</th><th>Price</th><th>ROC%</th><th>RSI</th><th>Status</th>
    </tr></thead><tbody>`;
    r.top_10_candidates.forEach(t => {
      html += `<tr><td>${t.rank}</td><td class="text-cell">${t.ticker.replace(".NS","")}</td><td class="text-cell">${t.name}</td>
        <td class="text-cell">${t.sector}</td><td>${fmtCurrency(t.price,2)}</td>
        <td class="${signClass(t.roc_pct)}">${fmtPct(t.roc_pct)}</td><td>${fmtNum(t.rsi,1)}</td>
        <td class="text-cell muted">${t.status}${t.reason ? " (" + t.reason + ")" : ""}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += emptyState("No screening data yet.");
  }
  html += `</div>`;

  if (r.commentary) {
    html += `<div class="panel fade-in"><h3>Commentary</h3><p style="line-height:1.6; color:var(--text-secondary); font-size:0.86rem;">${r.commentary}</p></div>`;
  }

  if ((r.errors && r.errors.length) || (r.warnings && r.warnings.length)) {
    html += `<div class="panel fade-in"><h3>System Health (latest run)</h3><ul>`;
    (r.errors || []).forEach(e => html += `<li class="neg">${e}</li>`);
    (r.warnings || []).forEach(w => html += `<li class="muted">${w}</li>`);
    html += `</ul></div>`;
  }

  c.innerHTML = html;

  const pdfList = document.getElementById("pdf-list");
  try {
    const manifestRes = await fetch(`reports/manifest.json?t=${Date.now()}`, { cache: "no-store" });
    const manifest = manifestRes.ok ? await manifestRes.json() : [];
    pdfList.innerHTML = manifest.length
      ? manifest.map(m => `<li><span>${m.date}</span><a class="download" href="reports/${m.filename}" download>↓ Download PDF</a></li>`).join("")
      : emptyState("No PDF reports mirrored yet.");
  } catch (e) {
    pdfList.innerHTML = emptyState("No PDF reports mirrored yet.");
  }
})();
</script>
</body>
</html>
