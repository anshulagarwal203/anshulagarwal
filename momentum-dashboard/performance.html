<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Dashboard — Performance</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="mode-banner">MODE: PAPER TRADING — no real orders, ever, on this site</div>
<div class="topbar">
  <div class="brand"><a href="../index.html" class="back">← anshulagarwal.com</a><span class="dot"></span> Momentum Dashboard</div>
  <nav class="tabs" id="nav-tabs"></nav>
</div>
<main>
  <h1>Performance</h1>
  <p class="subtitle" id="generated-at">Loading… extends automatically after every completed trading day.</p>

  <div class="panel">
    <h3>Equity Curve — Portfolio Value, Cash, Invested Capital</h3>
    <canvas id="equity-chart" style="width:100%;height:300px;"></canvas>
  </div>
  <div class="panel">
    <h3>Drawdown</h3>
    <canvas id="drawdown-chart" style="width:100%;height:220px;"></canvas>
  </div>
</main>
<script src="assets/app.js"></script>
<script>
(async function () {
  renderNav("performance.html");
  const perf = await fetchJSON("performance.json");

  document.getElementById("generated-at").textContent = perf
    ? `Generated ${fmtDate(perf.generated_at)} — extends automatically after every completed trading day.`
    : "No data yet.";

  if (!perf || !perf.available) {
    simpleLineChart("equity-chart", [], { emptyMsg: "No equity history yet — updates after the next paper trading session." });
    simpleLineChart("drawdown-chart", [], { emptyMsg: "No equity history yet." });
    return;
  }

  simpleLineChart("equity-chart", [
    { label: "Portfolio Value", color: CHART_COLORS.portfolio, points: seriesFromDict(perf.equity_curve) },
    { label: "Cash", color: CHART_COLORS.cash, points: seriesFromDict(perf.cash_curve) },
    { label: "Invested Capital", color: CHART_COLORS.invested, points: seriesFromDict(perf.invested_capital_curve) },
  ], { yDecimals: 0 });

  simpleLineChart("drawdown-chart", [{ label: "Drawdown %", color: CHART_COLORS.red, points: seriesFromDict(perf.drawdown_curve) }], { yDecimals: 1, legend: false });
})();
</script>
</body>
</html>
